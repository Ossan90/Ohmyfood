<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kazak: a YouTube-style catalogue restricted to the videos that Hacker News has recommended again and again over the years." />
  <meta name="color-scheme" content="light dark" />
  <title>Kazak — Videos Hacker News keeps recommending</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff0033'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__left">
      <button class="icon-btn" id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Kazak home">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 7l8 5-8 5z"/></svg></span>
        <span class="brand__name">Kazak</span>
        <span class="brand__tag">HN</span>
      </a>
    </div>

    <form class="search" id="search-form" role="search" action="#/search/">
      <label class="visually-hidden" for="search-input">Search videos</label>
      <input id="search-input" class="search__input" type="search" placeholder="Search" autocomplete="off" />
      <button class="search__btn" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      </button>
    </form>

    <div class="topbar__right">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.3A5.5 5.5 0 0 1 13.3 3.1 9 9 0 0 0 12 3z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5h0l1 3h-2zm0 20l-1-3h2zM2 12l3-1v2zm20 0l-3 1v-2zM4.9 4.9l2.8 1.4-1.4 1.4zm14.2 14.2l-2.8-1.4 1.4-1.4zM4.9 19.1l1.4-2.8 1.4 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Primary">
      <a class="nav-item" href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l8-7 8 7v11h-6v-6h-4v6H4z"/></svg><span>Home</span>
      </a>
      <a class="nav-item" href="#/?sort=points" data-nav="points">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><span>Top on HN</span>
      </a>
      <a class="nav-item" href="#/?sort=years" data-nav="years">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.4l4 2.4-.8 1.3L11 13V7z"/></svg><span>Evergreen</span>
      </a>
      <a class="nav-item" href="#/?sort=recent" data-nav="recent">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 7l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg><span>Resurfacing</span>
      </a>
      <a class="nav-item" href="#/about" data-nav="about">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg><span>How it works</span>
      </a>
      <a class="nav-item" id="topic-switch" href="ai/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2v2H7a3 3 0 0 0-3 3v2H2v2h2v2H2v2h2v2a3 3 0 0 0 3 3h2v2h2v-2h2v2h2v-2h2a3 3 0 0 0 3-3v-2h2v-2h-2v-2h2V9h-2V7a3 3 0 0 0-3-3h-2V2h-2v2h-2V2zm-1 6h8v8H8z"/></svg><span>AI only</span>
      </a>
      <h2 class="sidebar__heading">Channels</h2>
      <div id="sidebar-channels"></div>
      <p class="sidebar__foot" id="sidebar-foot"></p>
    </nav>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <script src="data/videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
